name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Skip npm publish, only build and pack"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-15
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
          - target: win32-x64
            runs-on: windows-2022
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Liberica NIK (JDK 21 + native-image)
        uses: actions/setup-java@v6.2.0
        with:
          java-version: "21.0.13.0.3+6"
          distribution: "liberica-nik"

      - name: Set up Maven (windows only)
        if: runner.os == 'Windows'
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Build fat jar
        working-directory: java
        run: mvn -B -q -DskipTests package

      - name: Build native binary
        env:
          # Keep the published macOS 14 compatibility floor on newer runners.
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: >-
          native-image
          -H:+UnlockExperimentalVMOptions
          --no-fallback
          -H:+AddAllCharsets
          -H:ConfigurationFileDirectories=.ni-config
          -H:Name=mpxj-convert
          -H:Path=bin
          -jar java/target/mpxj-convert.jar

      - name: Verify macOS binary compatibility
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          architecture=$(lipo -archs bin/mpxj-convert)
          minimum=$(otool -l bin/mpxj-convert | awk '$1 == "minos" { print $2 }')
          if [ "${architecture}" != "arm64" ] || [ "${minimum}" != "14.0" ]; then
            echo "Expected arm64/macOS 14.0; got ${architecture}/macOS ${minimum}"; exit 1
          fi

      - name: Stage sidecar package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          dest="packages/${target}"
          mkdir -p "${dest}/bin"
          if [ "${target}" = "win32-x64" ]; then
            cp bin/mpxj-convert.exe "${dest}/bin/mpxj-convert.exe"
          else
            cp bin/mpxj-convert "${dest}/bin/mpxj-convert"
            chmod +x "${dest}/bin/mpxj-convert"
          fi
          # darwin-x64 was dropped — no Intel-mac runner.
          cp packages/_assets/LICENSE "${dest}/LICENSE"
          cp packages/_assets/NOTICE "${dest}/NOTICE"
          sed "s/__PLATFORM__/${target}/g" packages/_assets/README.md > "${dest}/README.md"

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-${{ matrix.target }}
          path: packages/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org/"

      - name: Set up npm for trusted publishing
        run: npm install --global npm@11.21.2

      - name: Download all sidecar artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Restore sidecar packages
        run: |
          set -euo pipefail
          for d in artifacts/sidecar-*; do
            target="${d#artifacts/sidecar-}"
            rm -rf "packages/${target}"
            mv "${d}" "packages/${target}"
            # GH Actions artifacts use zip and strip the +x bit. Restore it on the
            # native binary; without this, every consumer hits EACCES on spawn.
            if [ -f "packages/${target}/bin/mpxj-convert" ]; then
              chmod +x "packages/${target}/bin/mpxj-convert"
            fi
            ls -lh "packages/${target}/bin"
          done

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          # Reject tag/version drift before any package can reach npm.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "${pkg}" != "${tag}" ]; then
              echo "package.json version (${pkg}) does not match tag (${tag})"; exit 1
            fi
            echo "version=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${pkg}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify sidecar versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 linux-arm64 linux-x64 win32-x64; do
            sidecar=$(node -p "require('./packages/${target}/package.json').version")
            dependency=$(node -p "require('./package.json').optionalDependencies['@byteink/mppjs-${target}']")
            if [ "${sidecar}" != "${VERSION}" ] || [ "${dependency}" != "${VERSION}" ]; then
              echo "Sidecar ${target} must match release version ${VERSION}"; exit 1
            fi
          done

      - name: Compile TypeScript
        run: |
          # The optional sidecars are not on npm until this workflow publishes them.
          npm install --ignore-scripts
          npm run build:ts

      - name: Publish sidecar packages
        run: |
          set -euo pipefail
          for target in darwin-arm64 linux-arm64 linux-x64 win32-x64; do
            echo "=== publishing @byteink/mppjs-${target} ==="
            # Leading ./ stops npm from treating the path as a github shorthand spec.
            npm publish --access public --provenance "./packages/${target}"
          done

      - name: Publish main package
        run: npm publish --access public --provenance
